site_name: "Documentació i Desplegament de Servidors (SRE-Docs)"
site_description: "Portal de documentació tècnica per al desplegament d'un servidor corporatiu LAMP i la seua seguretat."
site_author: "Adrián, Carles, Michael i Javi"
site_url: "https://sre-docs.local"

repo_name: "SRE-Docs"
repo_url: "https://github.com/sre-docs/sre-docs"

docs_dir: docs
site_dir: site

theme:
  name: material
  language: ca
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Canvia al mode fosc
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Canvia al mode clar
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: ca

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sre-docs
  version:
    provider: mike
  authors:
    - name: Adrián
      role: Scrum Master / root
    - name: Carles
      role: Administrador Web / admin-web
    - name: Michael
      role: Seguretat / db-backup
    - name: Javi
      role: Auditor / sys-monitor

copyright: "© 2024 SRE-Docs · Adrián, Carles, Michael i Javi · Projecte 1r ASIR"

nav:
  - Inici: index.md
  - Configuració de Servidors: servidors.md
  - Gestió de Rols i Usuaris: usuaris.md
  - Seguretat i Hardening: seguretat.md
