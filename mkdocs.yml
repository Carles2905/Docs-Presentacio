site_name: "Documentación y Despliegue de Servidores (SRE-Docs)"
site_description: "Portal de documentación técnica para el despliegue de un servidor corporativo LAMP y su seguridad."
site_author: "Adrián, Carles, Michael y Javi"
site_url: "https://carles2905.github.io/Docs-Presentacio"

repo_name: "Carles2905/Docs-Presentacio"
repo_url: "https://github.com/Carles2905/Docs-Presentacio"

docs_dir: docs
site_dir: site

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Cambiar al modo oscuro
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Cambiar al modo claro
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sre-docs
  version:
    provider: mike
  authors:
    - name: Adrián
      role: Scrum Master / root
    - name: Carles
      role: Administrador Web / admin-web
    - name: Michael
      role: Seguridad / db-backup
    - name: Javi
      role: Auditor / sys-monitor

copyright: "© 2026 SRE-Docs · Adrián, Carles, Michael y Javi · Proyecto 1º ASIR"

nav:
  - Inicio: index.md
  - Configuración de Servidores: servidors.md
  - Gestión de Roles y Usuarios: usuaris.md
  - Seguridad y Hardening: seguretat.md
